name: .NET MAUI CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore dependencies
        run: dotnet restore Accelerator.Application.sln

      - name: Build
        run: dotnet build Accelerator.Application.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Accelerator.Application.sln --no-build --configuration Release --verbosity normal
